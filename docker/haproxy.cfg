# Webhook Trap capture gate: per-address limits in front of `ingest` (decision 61; A09 slice 3
# S3-4, S3-17 to S3-19, S3-24 and decision 2). Official HAProxy LTS image, same file in both
# Compose profiles (compose-profile.md §2.4). Path of a capture: [host proxy] → app (Caddy, trust
# snippet, hop re-signed with the edge secret) → haproxy:8080 → ingest:8080.
#
# HAProxy adds no header and changes no header, target or body: no `option forwardfor`, no
# `http-request set-header`, no request log (the path holds the capture key).
# Limits come from the environment; Compose always sets them (`${VAR:-default}` there, because
# HAProxy's own `-` default does not cover an empty value). Checked with `haproxy -c` in CI.

global
    # Startup and alert lines only; requests are never logged (RD-1).
    log stdout format raw local0 notice
    maxconn 1024
    # Header block up to about 31 KiB (the image already refuses larger ones, compose-profile §2.3).
    tune.bufsize 32768

defaults
    mode http
    # No `log global`: no traffic log at all (the path holds the capture key, RD-1).
    timeout connect 2s
    # Headers, and a body held by `wait-for-body`, must arrive within 15 s (S3-4).
    timeout http-request 15s
    timeout http-keep-alive 10s
    timeout client 120s
    # S3-19: above ingest's worst case (15 s body + 60 s max_execution_time + lock waits), so the
    # app's own deadline always answers first and no 504 can depend on a key's state.
    timeout server 100s
    timeout queue 10s
    # S3-19: every answer HAProxy produces itself has a fixed body and ingest's headers, whatever
    # the key. A request whose headers or body do not arrive in time gets exactly what ingest gives
    # for a body it cuts at 15 s: 200 {"received":true} (ADR-005 am. 1 §4).
    errorfile 408 /wt-haproxy/received-200.http
    http-error status 400 content-type application/json hdr Cache-Control "no-store, private" string '{"error":"bad_request"}'
    http-error status 413 content-type application/json hdr Cache-Control "no-store, private" string '{"error":"too_large"}'
    http-error status 429 content-type application/json hdr Cache-Control "no-store, private" hdr Retry-After 60 string '{"error":"rate_limited"}'
    http-error status 500 content-type application/json hdr Cache-Control "no-store, private" hdr Retry-After 60 string '{"error":"unavailable"}'
    http-error status 502 content-type application/json hdr Cache-Control "no-store, private" hdr Retry-After 60 string '{"error":"unavailable"}'
    http-error status 503 content-type application/json hdr Cache-Control "no-store, private" hdr Retry-After 60 string '{"error":"unavailable"}'
    http-error status 504 content-type application/json hdr Cache-Control "no-store, private" hdr Retry-After 60 string '{"error":"unavailable"}'

resolvers docker
    # Docker's embedded DNS. S3-18: while `ingest` is recreated its name disappears for a moment;
    # keep the last good address so the server is retried, not put in maintenance.
    # A recreated ingest may come back on a new address: switch to it as soon as it is answered
    # (obsolete 1s), re-asking every second.
    nameserver dns 127.0.0.11:53
    timeout resolve 1s
    hold valid 10s
    hold nx 30s
    hold refused 30s
    hold timeout 30s
    hold obsolete 1s

# One entry per client network (IPv4 /32, IPv6 /64, as the app's limiter), never per key.
backend st_client
    stick-table type ipv6 size 50k expire 120s store conn_cur,http_req_rate(60s)

# S3-17: the same key, for requests whose body is still arriving when they reach ingest.
backend st_stream
    stick-table type ipv6 size 50k expire 120s store conn_cur

frontend capture
    bind :8080
    # Who the client is. The app front signs every hop with the edge secret and sends exactly one
    # X-Forwarded-For: the address it resolved under PROXY_TRUST_MODE (host proxy's value on a
    # verified hosted request, the TCP peer otherwise). Anything else that reaches this port is keyed
    # on its own TCP address. The secret file is read as a pattern file; it is never logged.
    acl hop_signed req.hdr(X-WT-Edge) -m str -f /run/secrets/edge_proxy_secret
    http-request set-var(txn.client) src,ipmask(32,64)
    http-request set-var(txn.client) req.hdr_ip(X-Forwarded-For,-1),ipmask(32,64) if hop_signed
    http-request track-sc0 var(txn.client) table st_client

    # S3-4: at most WT_CAPTURE_MAX_CONN (20) captures in flight per client network.
    # Decision 2: backstop of WT_CAPTURE_MAX_RATE (1200) per minute (twice the app's 600), so it only
    # acts while the app limiter is down (it fails open).
    acl over_conn sc0_conn_cur gt "${WT_CAPTURE_MAX_CONN-20}"
    acl over_rate sc0_http_req_rate gt "${WT_CAPTURE_MAX_RATE-1200}"
    # The app's own 429, byte for byte: same status, headers and body whatever the key (ADR-005 §4).
    http-request return status 429 content-type application/json hdr Cache-Control "no-store, private" hdr Retry-After 60 string '{"error":"rate_limited"}' if over_conn || over_rate

    # A declared body over 25 MiB gets ingest's own 413 at once, instead of being waited for.
    http-request return status 413 content-type application/json hdr Cache-Control "no-store, private" string '{"error":"too_large"}' if { req.hdr_val(content-length) gt 26214400 }

    # S3-4: hold the body here (up to the 32 KiB buffer, at most 15 s) before ingest is called, so a
    # slow sender of a small body never holds an ingest PHP thread (it gets the 408 answer above).
    http-request wait-for-body time 15s

    # S3-17: a request is "partial" when its body is not complete as it leaves here: chunked, or
    # shorter than its Content-Length (the body was larger than the buffer). Only those can hold an
    # ingest thread for their body time, so they get their own limits:
    #   - WT_CAPTURE_MAX_STREAM (2) in flight per client network;
    #   - WT_CAPTURE_STREAM_SLOTS (INGEST_NUM_THREADS - 2 = 6) in flight in total, so at least two
    #     ingest threads stay free for complete bodies whatever any number of addresses do.
    # Over either: the same 429. Complete bodies (most webhooks) are not affected.
    http-request set-var(txn.blen) req.body_len
    acl partial req.hdr_cnt(transfer-encoding) gt 0
    acl partial req.hdr_val(content-length),sub(txn.blen) gt 0
    http-request track-sc1 var(txn.client) table st_stream if partial
    acl over_stream sc1_conn_cur gt "${WT_CAPTURE_MAX_STREAM-2}"
    acl stream_full be_conn(ingest_stream) ge "${WT_CAPTURE_STREAM_SLOTS-6}"
    http-request return status 429 content-type application/json hdr Cache-Control "no-store, private" hdr Retry-After 60 string '{"error":"rate_limited"}' if partial over_stream || partial stream_full

    use_backend ingest_stream if partial
    default_backend ingest

# S3-18: an ingest restart or recreate (deploy) is retried here, about once a second for 30 s,
# instead of answered 503.
backend ingest
    retries 30
    retry-on conn-failure empty-response
    # Re-pick the server, so its re-resolved address, on every retry (a recreate may change it).
    option redispatch 1
    server ingest ingest:8080 resolvers docker init-addr last,libc,none

backend ingest_stream
    retries 30
    retry-on conn-failure empty-response
    # Re-pick the server, so its re-resolved address, on every retry (a recreate may change it).
    option redispatch 1
    # Hard ceiling behind the 429 above (it only queues in a race between two arrivals).
    server ingest ingest:8080 resolvers docker init-addr last,libc,none maxconn "${WT_CAPTURE_STREAM_SLOTS-6}"

# Healthcheck only, on loopback inside the container.
frontend health
    bind 127.0.0.1:8405
    http-request return status 200 content-type text/plain string ok
