; Webhook Trap runtime settings (compose-profile.md §1).
expose_php = Off
; Capture host accepts 25 MiB bodies (Caddy enforces it first); PHP sits just above.
post_max_size = 26M
upload_max_filesize = 26M
memory_limit = 256M
max_execution_time = 60
; argon2id is allocated outside memory_limit; the container mem_limit bounds it (compose-profile §3.1).
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
session.use_strict_mode = 1
zend.exception_ignore_args = On
log_errors = On
display_errors = Off
