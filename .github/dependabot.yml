# Dependency bumps (ci-cd.md §1.3, §1.4). Pull requests are never auto-merged: a human reads each
# bump, Actions SHA bumps included.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    cooldown: { default-days: 5 }
    groups:
      github-actions: { patterns: ["*"] }
  - package-ecosystem: "composer"
    directory: "/"
    schedule: { interval: "weekly" }
    cooldown: { default-days: 5 }
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    cooldown: { default-days: 5 }
  - package-ecosystem: "gomod"
    directory: "/agent"
    schedule: { interval: "weekly" }
    cooldown: { default-days: 5 }
  - package-ecosystem: "docker"
    directories: ["/", "/docker/postgres"]
    schedule: { interval: "weekly" }
    cooldown: { default-days: 5 }
